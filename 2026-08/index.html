<!doctype html>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#071426;color:#fff;padding:20px}
.plan{max-width:980px;margin:auto;position:relative;overflow:hidden;border:2px solid #2d8cff;border-radius:20px;background:#0b1d33;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.42)}
.plan:before{content:"Schuppen Sued";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-18deg);font-family:cursive;font-size:110px;font-weight:800;color:rgba(95,175,255,.055);white-space:nowrap;pointer-events:none}
h1,.sub,table,.actions{position:relative}
h1{margin:0;text-align:center;font-size:clamp(32px,6vw,62px)}
.sub{text-align:center;color:#bfe0ff;font-size:clamp(18px,3vw,28px);margin:8px 0 22px}
table{width:100%;border-collapse:collapse;font-size:clamp(16px,2.2vw,24px)}
th,td{border-bottom:1px solid rgba(95,165,230,.28);padding:13px 10px;text-align:left;vertical-align:top}
th{color:#90c7ff}
th:first-child,td:first-child{width:19%}
th:nth-child(2),td:nth-child(2){width:66%}
th:nth-child(3),td:nth-child(3){width:15%}
.price{text-align:right;white-space:nowrap;font-weight:800}
.actions{text-align:center;margin-top:24px}
button{border:1px solid #4ba0f5;border-radius:10px;background:#1767aa;color:#fff;padding:12px 18px;font-size:17px;font-weight:800;cursor:pointer}
@media print{
 body{background:#fff;color:#000;padding:0}
 .plan{border:0;box-shadow:none;background:#fff;color:#000}
 .plan:before{color:rgba(0,0,0,.04)}
 .actions{display:none}
 th{color:#333}
}

</head>
<body>
<main class="plan">

<div class="sub">Essensplan August 2026</div>
<table>
